name: Liberty Athletics Schedule Monitor

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'What do you want to test?'
        required: true
        default: 'connection'
        type: choice
        options:
          - connection
          - simulate_delay

permissions:
  contents: write

concurrency:
  group: liberty-athletics-schedule-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send connection test
        if: github.event_name == 'workflow_dispatch' && inputs.test_mode == 'connection'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: 'true'
          SIMULATE_DELAY: 'false'
        run: python monitor.py

      - name: Simulate home-game delay
        if: github.event_name == 'workflow_dispatch' && inputs.test_mode == 'simulate_delay'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: 'false'
          SIMULATE_DELAY: 'true'
        run: python monitor.py

      - name: Check Liberty schedules and official news
        if: github.event_name == 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: 'false'
          SIMULATE_DELAY: 'false'
        run: python monitor.py

      - name: Save updated monitor state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the freshly generated state, then move onto the newest
          # version of the branch before committing it. This prevents stale
          # scheduled/re-run jobs from failing with a non-fast-forward push.
          cp state.json /tmp/liberty-state.json
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/liberty-state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "No monitor state changes to save."
          else
            git commit -m "Update athletics monitor state"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
