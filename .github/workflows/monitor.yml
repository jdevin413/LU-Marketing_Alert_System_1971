name: Liberty Athletics Schedule Monitor

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liberty-athletics-schedule-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send manual test notification
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: 'true'
        run: python monitor.py

      - name: Check Liberty schedules
        if: github.event_name == 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: 'false'
        run: python monitor.py

      - name: Save updated schedule state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the freshly generated state, then move onto the newest
          # version of the branch before committing it. This prevents stale
          # scheduled/re-run jobs from failing with a non-fast-forward push.
          cp state.json /tmp/liberty-state.json
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/liberty-state.json state.json

          git add state.json
          if git diff --cached --quiet; then
            echo "No schedule changes to save."
          else
            git commit -m "Update athletics schedule state"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
